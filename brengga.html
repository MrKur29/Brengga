<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brengga — Kurnia's Food</title>
<style>
  :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:#f3f4f6; color:#111827; }
  body { margin:0; padding:0; background:#f3f4f6; }
  .page { max-width:1200px; margin:0 auto; padding:16px; box-sizing:border-box; }
  h2 { margin:0 0 4px; font-size:1.15rem; }
  label { display:block; margin-top:10px; margin-bottom:4px; font-size:.85rem; color:#374151; }
  input, select, textarea { width:100%; padding:8px 10px; border-radius:8px; border:1px solid #d1d5db; font-size:.92rem; box-sizing:border-box; font-family:inherit; background:#fff; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:#2563eb; box-shadow:0 0 0 1px rgba(37,99,235,.15); }
  input.num { text-align:right; }
  button { cursor:pointer; border-radius:8px; border:none; padding:9px 14px; font-size:.9rem; font-family:inherit; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .btn-primary { background:#2563eb; color:#fff; } .btn-primary:hover { background:#1d4ed8; }
  .btn-red { background:#c1272d; color:#fff; } .btn-red:hover { background:#a11f24; }
  .btn-green { background:#0a7a2f; color:#fff; } .btn-green:hover { background:#086325; }
  .btn-light { background:#e5e7eb; color:#111827; } .btn-light:hover { background:#d1d5db; }
  .btn-ghost { background:transparent; color:#e5e7eb; border:1px solid transparent; }
  .btn-ghost:hover { background:#374151; border-color:#4b5563; }
  .btn-sm { padding:5px 9px; font-size:.8rem; }

  #login-page { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; box-sizing:border-box; }
  .login-card { background:#fff; border-radius:8px; padding:20px 16px; box-shadow:0 2px 10px rgba(0,0,0,.08); width:100%; max-width:380px; box-sizing:border-box; }
  .login-error { margin-top:8px; font-size:12px; color:#b91c1c; }

  #app-page { display:none; min-height:100vh; }
  .app-shell { display:grid; grid-template-columns:220px 1fr; grid-template-rows:auto 1fr; grid-template-areas:"header header" "sidebar main"; gap:12px; }
  .app-header { grid-area:header; background:#111827; color:#fff; border-radius:0 0 12px 12px; padding:10px 12px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .brand { font-weight:600; font-size:.95rem; display:flex; align-items:center; gap:8px; }
  .logo-dot { width:20px; height:20px; border-radius:999px; background:#0ea5e9; display:inline-block; }
  .user-info { font-size:.8rem; color:#e5e7eb; text-align:right; }
  .app-sidebar { grid-area:sidebar; background:#fff; border-radius:12px; padding:10px; box-shadow:0 4px 15px rgba(0,0,0,.04); display:flex; flex-direction:column; gap:4px; align-self:start; }
  .menu-title { font-size:.8rem; font-weight:600; color:#6b7280; margin:8px 0 4px; text-transform:uppercase; letter-spacing:.03em; }
  .menu-btn { width:100%; text-align:left; padding:9px 10px; background:transparent; font-size:.9rem; color:#374151; display:flex; justify-content:space-between; align-items:center; }
  .menu-btn:hover { background:#e5e7eb; }
  .menu-btn.active { background:#2563eb; color:#fff; }
  .nbadge { background:#c1272d; color:#fff; border-radius:999px; font-size:.72rem; padding:1px 7px; min-width:10px; text-align:center; }
  .nbadge.zero { display:none; }
  .app-main { grid-area:main; background:#fff; border-radius:12px; padding:14px; box-shadow:0 4px 15px rgba(0,0,0,.04); min-height:400px; min-width:0; }
  .badge-role { display:inline-block; padding:2px 8px; border-radius:999px; font-size:.75rem; background:#374151; color:#e5e7eb; margin-left:4px; }
  #btn-toggle-sidebar { display:none; border-radius:999px; background:#1f2937; color:#e5e7eb; border:1px solid #374151; padding:6px 10px; }
  @media (max-width:768px) {
    .page { padding:8px; }
    .app-shell { grid-template-columns:1fr; grid-template-rows:auto auto 1fr; grid-template-areas:"header" "sidebar" "main"; }
    #btn-toggle-sidebar { display:inline-flex; }
    .collapsed .app-sidebar { display:none; }
  }

  .section-title { font-weight:600; margin:16px 0 8px; color:#0b1f3b; border-left:4px solid #c1272d; padding-left:8px; }
  .muted { color:#6b7280; font-size:.85rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:10px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; }
  .row > * { flex:1 1 140px; }
  .row > .auto { flex:0 0 auto; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .tbl-wrap { overflow-x:auto; margin-top:8px; }
  table.tbl { width:100%; border-collapse:collapse; font-size:13px; }
  .tbl th, .tbl td { border:1px solid #dde3f0; padding:5px 6px; text-align:left; vertical-align:middle; }
  .tbl th { background:#f0f2f7; white-space:nowrap; }
  .tbl td.n, .tbl th.n { text-align:right; white-space:nowrap; }
  .tbl tfoot td { font-weight:600; background:#f9fafc; }
  .tbl tr.click { cursor:pointer; } .tbl tr.click:hover { background:#eef2ff; }
  .tbl input { padding:4px 6px; font-size:13px; min-width:70px; }
  .tbl input.prefill { background:#eff6ff; border-color:#bfdbfe; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:.75rem; font-weight:600; white-space:nowrap; }
  .p-gray { background:#e5e7eb; color:#374151; } .p-blue { background:#dbeafe; color:#1e40af; }
  .p-green { background:#dcfce7; color:#166534; } .p-amber { background:#fef3c7; color:#92400e; }
  .p-red { background:#fee2e2; color:#991b1b; }
  .card { border:1px solid #e5e7eb; border-radius:10px; padding:12px; background:#fafafa; }
  .card .big { font-size:1.6rem; font-weight:700; margin-top:4px; }
  .card.alert { border-color:#f0a6a0; background:#fdecea; }
  .msg { margin-top:10px; font-size:.88rem; padding:8px 10px; border-radius:8px; display:none; white-space:pre-line; }
  .msg.err { display:block; background:#fdecea; color:#a02017; border:1px solid #f0a6a0; }
  .msg.ok { display:block; background:#e8f6ec; color:#0a7a2f; border:1px solid #a3d7b1; }
  .msg.info { display:block; background:#eff6ff; color:#1e3a8a; border:1px solid #bfdbfe; }
  .hidden { display:none !important; }
  .age-13 { background:#fff7ed; } .age-26 { background:#fdecea; }
  .fifo { color:#0a7a2f; font-weight:600; }
  .back { background:none; color:#2563eb; padding:0; margin-bottom:8px; font-size:.88rem; }
  @media print { .app-header, .app-sidebar, .actions, .back, .noprint { display:none !important; } .app-shell { display:block; } .app-main { box-shadow:none; } }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-page">
  <div class="login-card">
    <h2>Brengga — Kurnia's Food</h2>
    <p class="muted" style="margin:0 0 6px">Login dengan akun WMS.</p>
    <label for="login-email">Email</label>
    <input id="login-email" type="email" autocomplete="username">
    <label for="login-pass">Password</label>
    <input id="login-pass" type="password" autocomplete="current-password">
    <button id="login-btn" class="btn-primary" style="width:100%;margin-top:14px">Login</button>
    <div id="login-error" class="login-error"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app-page">
 <div class="page">
  <div class="app-shell" id="shell">
    <header class="app-header">
      <div class="brand">
        <button id="btn-toggle-sidebar" class="btn-sm">☰</button>
        <span class="logo-dot"></span><span>Brengga &mdash; Kurnia's Food</span>
      </div>
      <div>
        <div class="user-info" id="user-info"></div>
        <div style="text-align:right;margin-top:4px"><button id="logout-btn" class="btn-ghost btn-sm">Logout</button></div>
      </div>
    </header>

    <aside class="app-sidebar">
      <div class="menu-title">Ringkasan</div>
      <button class="menu-btn" data-page="dash"><span>Dashboard</span></button>
      <div class="menu-title">Transaksi</div>
      <button class="menu-btn" data-page="terima"><span>Terima dari WMS</span><span class="nbadge zero" id="nb-terima">0</span></button>
      <button class="menu-btn" data-page="ps"><span>Picking Slip Brengga</span><span class="nbadge zero" id="nb-draft">0</span></button>
      <button class="menu-btn" data-page="kewms"><span>Kiriman ke WMS</span><span class="nbadge zero" id="nb-kewms">0</span></button>
      <button class="menu-btn" data-page="selisih"><span>Selisih</span><span class="nbadge zero" id="nb-selisih">0</span></button>
      <div class="menu-title">Laporan</div>
      <button class="menu-btn" data-page="rekap"><span>Rekap Stok</span></button>
      <button class="menu-btn" data-page="mutasi"><span>Laporan Mutasi</span></button>
      <button class="menu-btn" data-page="slow"><span>Slow Moving</span></button>
      <div class="menu-title admin-only" style="display:none">Admin</div>
      <button class="menu-btn admin-only" data-page="impor" style="display:none"><span>Impor Saldo Awal</span></button>
    </aside>

    <main class="app-main" id="main"></main>
  </div>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ====== SUPABASE (sama dengan WMS) ======
  const SUPABASE_URL = 'https://zdkcuprmdtxahrxhgucy.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpka2N1cHJtZHR4YWhyeGhndWN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQyMjYxMjQsImV4cCI6MjA3OTgwMjEyNH0.z_OA2XvyY2VqOpBwHLmpQ1rE5PD3y8eGP_GGbEZpl3E';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const B = sb.schema('brengga');   // schema aplikasi Brengga (WMS hanya dibaca)

  // ====== STATE ======
  const S = { user:null, profile:null, approver:false, items:{}, customers:[], tol:0.1, page:'dash' };

  // ====== UTIL ======
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
  const nf = (v, d=0) => (v === null || v === undefined || v === '') ? '' : Number(v).toLocaleString('id-ID', { minimumFractionDigits:d, maximumFractionDigits:d });
  const kg = (v) => nf(v, 2);
  const today = () => new Date().toLocaleDateString('sv-SE');
  const fdate = (d) => { if (!d) return ''; const [y,m,dd] = String(d).slice(0,10).split('-'); return `${dd}/${m}/${y}`; };
  const fdt = (d) => d ? new Date(d).toLocaleString('id-ID', { dateStyle:'short', timeStyle:'short' }) : '';
  const itemName = (id) => S.items[id]?.item_name || '(item?)';
  const num = (v) => (v === '' || v === null || v === undefined) ? null : Number(String(v).replace(',', '.'));
  function msg(el, text, type='err') { el.className = 'msg ' + type; el.textContent = text; }
  function clearMsg(el) { el.className = 'msg'; el.textContent = ''; }
  function errText(e) {
    const t = (e && (e.message || e.details || e.hint)) || String(e);
    if (/permission denied for schema|jwt expired|invalid jwt|not authenticated/i.test(t))
      return 'Sesi login sudah berakhir (mis. logout di tab/aplikasi WMS lain). Muat ulang halaman ini lalu login lagi.\n(' + t + ')';
    return t;
  }
  async function must(p) { const { data, error } = await p; if (error) throw error; return data; }
  function pill(status) {
    const map = { DRAFT:'p-amber', FINAL:'p-green', BATAL:'p-gray', MENUNGGU:'p-blue', DRAFT_TERIMA:'p-amber',
      DITERIMA:'p-green', DITERIMA_SELISIH:'p-red', BELUM:'p-blue', OK:'p-green', PERLU_APPROVAL:'p-red',
      DISETUJUI:'p-green', DITOLAK:'p-gray', SAMA:'p-green', TOLERANSI:'p-amber', SELISIH:'p-red', BELUM_DIISI:'p-gray',
      AKTIF:'p-green', HABIS:'p-gray', JUAL:'p-blue', KE_WMS:'p-amber' };
    return `<span class="pill ${map[status] || 'p-gray'}">${esc(String(status).replaceAll('_',' '))}</span>`;
  }
  function hasil(kirimK, kirimE, kirimKg, tK, tE, tKg) {
    if (tK === null || tKg === null || isNaN(tK) || isNaN(tKg)) return 'BELUM_DIISI';
    if (tK !== Number(kirimK)) return 'SELISIH';
    if (tE !== null && !isNaN(tE) && tE !== Number(kirimE)) return 'SELISIH';
    const d = Math.abs(tKg - Number(kirimKg));
    if (d > Number(kirimKg) * S.tol / 100 + 1e-9) return 'SELISIH';
    if (d > 0.0001) return 'TOLERANSI';
    return 'SAMA';
  }

  // ====== AUTH ======
  $('login-btn').addEventListener('click', async () => {
    $('login-error').textContent = '';
    const email = $('login-email').value.trim(), password = $('login-pass').value;
    if (!email || !password) { $('login-error').textContent = 'Email dan password wajib diisi.'; return; }
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { $('login-error').textContent = error.message || 'Login gagal.'; return; }
    await startApp();
  });
  $('login-pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('login-btn').click(); });
  $('logout-btn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });
  $('btn-toggle-sidebar').addEventListener('click', () => $('shell').classList.toggle('collapsed'));
  window.addEventListener('load', async () => {
    const { data } = await sb.auth.getSession();
    if (data.session) await startApp(); else $('login-page').style.display = 'flex';
  });

  async function startApp() {
    const { data: { user } } = await sb.auth.getUser();
    if (!user) { $('login-page').style.display = 'flex'; return; }
    S.user = user;
    if (!S.authWatch) { S.authWatch = true; sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') location.reload(); }); }
    const { data: profile } = await sb.from('profiles').select('full_name, role, is_active').eq('id', user.id).maybeSingle();
    if (profile && profile.is_active === false) { alert('Akun anda non-aktif.'); await sb.auth.signOut(); location.reload(); return; }
    S.profile = profile || {};
    const role = (S.profile.role || 'operator').toLowerCase();
    S.approver = ['admin', 'supervisor'].includes(role);
    document.querySelectorAll('.admin-only').forEach(el => el.style.display = S.approver ? '' : 'none');
    $('user-info').innerHTML = `${esc(S.profile.full_name || user.email)} <span class="badge-role">${esc(role)}</span>`;
    $('login-page').style.display = 'none';
    $('app-page').style.display = 'block';
    if (window.innerWidth <= 768) $('shell').classList.add('collapsed');

    try {
      const items = await must(sb.from('items').select('item_id, item_name, item_code'));
      items.forEach(i => S.items[i.item_id] = i);
      const set = await must(B.from('setting').select('key, value'));
      const tol = set.find(s => s.key === 'toleransi_kg_pct'); if (tol) S.tol = Number(tol.value);
      S.setting = Object.fromEntries(set.map(s => [s.key, s.value]));
    } catch (e) {
      $('main').innerHTML = `<div class="msg err">Gagal memuat data awal: ${esc(errText(e))}\n\nPastikan schema "brengga" sudah ditambahkan di Supabase → Settings → Data API → Exposed schemas.</div>`;
      return;
    }
    document.querySelectorAll('.menu-btn').forEach(b => b.addEventListener('click', () => go(b.dataset.page)));
    go('dash');
    refreshBadges();
    setInterval(refreshBadges, 60000);
  }

  async function refreshBadges() {
    const { data } = await B.from('v_notifikasi').select('*').maybeSingle();
    if (!data) return;
    const setB = (id, n) => { const el = $(id); el.textContent = n; el.classList.toggle('zero', !n); };
    setB('nb-terima', data.menunggu_konfirmasi_masuk);
    setB('nb-draft', data.draft_belum_final);
    setB('nb-kewms', data.ke_wms_belum_receipt);
    setB('nb-selisih', data.selisih_perlu_approval);
    S.notif = data;
  }

  const PAGES = {};
  function go(page, ...args) {
    S.page = page;
    document.querySelectorAll('.menu-btn').forEach(b => b.classList.toggle('active', b.dataset.page === page));
    if (window.innerWidth <= 768) $('shell').classList.add('collapsed');
    $('main').innerHTML = '<p class="muted">Memuat...</p>';
    Promise.resolve(PAGES[page](...args)).catch(e => { $('main').innerHTML = `<div class="msg err">${esc(errText(e))}</div>`; });
  }

  // =====================================================================
  // DASHBOARD
  // =====================================================================
  PAGES.dash = async () => {
    await refreshBadges();
    const n = S.notif || {};
    const stok = await must(B.from('v_stok_batch').select('sisa_karung, sisa_kg, umur_minggu').eq('status', 'AKTIF'));
    const tot = stok.reduce((a, r) => ({ k: a.k + r.sisa_karung, kg: a.kg + Number(r.sisa_kg) }), { k:0, kg:0 });
    const tua = stok.filter(r => r.umur_minggu >= 13);
    $('main').innerHTML = `
      <h2>Dashboard Brengga</h2>
      <p class="muted">Per ${fdate(today())}. Data WMS dibaca mulai ${fdate(S.setting?.mulai_baca_wms)}.</p>
      <div class="grid" style="margin-top:12px">
        <div class="card"><div class="muted">Stok Brengga</div><div class="big">${nf(tot.kg / 1000, 1)} ton</div><div class="muted">${nf(tot.k)} karung · ${nf(stok.length)} batch</div></div>
        <div class="card ${tua.length ? 'alert' : ''}"><div class="muted">Stok ≥ 13 minggu</div><div class="big">${nf(tua.reduce((a, r) => a + Number(r.sisa_kg), 0) / 1000, 1)} ton</div><div class="muted">${tua.length} batch</div></div>
        <div class="card ${n.menunggu_konfirmasi_masuk ? 'alert' : ''}"><div class="muted">Kiriman WMS menunggu konfirmasi</div><div class="big">${nf(n.menunggu_konfirmasi_masuk)}</div></div>
        <div class="card ${n.draft_lebih_1_hari ? 'alert' : ''}"><div class="muted">Draft belum final</div><div class="big">${nf(n.draft_belum_final)}</div><div class="muted">${nf(n.draft_lebih_1_hari)} lebih dari 1 hari</div></div>
        <div class="card ${n.selisih_perlu_approval ? 'alert' : ''}"><div class="muted">Selisih perlu approval</div><div class="big">${nf(n.selisih_perlu_approval)}</div></div>
        <div class="card ${n.ke_wms_belum_receipt ? 'alert' : ''}"><div class="muted">Kiriman ke WMS belum di-receipt</div><div class="big">${nf(n.ke_wms_belum_receipt)}</div></div>
      </div>`;
  };

  // =====================================================================
  // TERIMA DARI WMS
  // =====================================================================
  PAGES.terima = async () => {
    $('main').innerHTML = `
      <h2>Terima dari WMS</h2>
      <p class="muted">Picking slip WMS "Pindah Lokasi" ke gudang Brengga. Isi angka yang benar-benar diterima di Brengga.</p>
      <div class="row">
        <div><label>Dari tanggal</label><input type="date" id="t-dari" value="${S.setting?.mulai_baca_wms || ''}"></div>
        <div><label>Tampilkan</label><select id="t-filter"><option value="open">Belum selesai</option><option value="all">Semua</option></select></div>
        <div class="auto"><button class="btn-light" id="t-load">Muat</button></div>
      </div>
      <div class="tbl-wrap" id="t-list"></div>`;
    const load = async () => {
      const rows = await must(B.rpc('wms_kiriman_masuk', { p_dari: $('t-dari').value || null }));
      const g = {};
      rows.forEach(r => {
        const x = g[r.wms_ps_id] ||= { id:r.wms_ps_id, no:r.wms_ps_no, tgl:r.tgl, item:0, karung:0, kg:0, status:r.status_brengga || 'BELUM' };
        x.item++; x.karung += Number(r.karung); x.kg += Number(r.kg);
      });
      let list = Object.values(g);
      if ($('t-filter').value === 'open') list = list.filter(x => ['BELUM', 'MENUNGGU', 'DRAFT_TERIMA'].includes(x.status));
      $('t-list').innerHTML = list.length ? `<table class="tbl"><thead><tr><th>Tgl</th><th>No. Picking Slip WMS</th><th class="n">Item</th><th class="n">Karung</th><th class="n">Kg</th><th>Status Brengga</th><th></th></tr></thead><tbody>
        ${list.map(x => `<tr><td>${fdate(x.tgl)}</td><td><b>${esc(x.no)}</b></td><td class="n">${x.item}</td><td class="n">${nf(x.karung)}</td><td class="n">${kg(x.kg)}</td><td>${pill(x.status)}</td>
          <td><button class="btn-sm ${['BELUM','MENUNGGU','DRAFT_TERIMA'].includes(x.status) ? 'btn-primary' : 'btn-light'}" data-ps="${x.id}">${['BELUM','MENUNGGU','DRAFT_TERIMA'].includes(x.status) ? 'Proses' : 'Lihat'}</button></td></tr>`).join('')}
        </tbody></table>` : '<p class="muted">Tidak ada kiriman.</p>';
      $('t-list').querySelectorAll('button[data-ps]').forEach(b => b.addEventListener('click', () => go('terimaForm', b.dataset.ps)));
    };
    $('t-load').addEventListener('click', () => load().catch(e => $('t-list').innerHTML = `<div class="msg err">${esc(errText(e))}</div>`));
    $('t-filter').addEventListener('change', () => $('t-load').click());
    await load();
  };

  PAGES.terimaForm = async (wmsPsId) => {
    const trId = await must(B.rpc('mulai_terima_masuk', { p_wms_ps_id: wmsPsId }));
    const tr = await must(B.from('transfer').select('*').eq('id', trId).single());
    const lines = await must(B.from('v_transfer_cek').select('*').eq('transfer_id', trId).order('line_id'));
    const editable = ['MENUNGGU', 'DRAFT_TERIMA'].includes(tr.status);

  // =====================================================================
  // IMPOR SALDO AWAL (admin/supervisor) — bisa bertahap, BR yang sudah ada dilewati
  // =====================================================================
  const IMP = { rows: [], exist: new Set(), byName: null };

  function impNorm(s) { return String(s ?? '').toUpperCase().replace(/\s+/g, ' ').trim(); }
  function impEnsure() {
    if (IMP.byName) return;
    IMP.byName = {};
    Object.values(S.items).forEach(i => { (IMP.byName[impNorm(i.item_name)] ||= []).push(i.item_id); });
  }
  // "F-AU 0.3" (Excel) -> "AU 0.3" (master item WMS)
  function impFindItem(size) {
    impEnsure();
    const n = impNorm(size); if (!n) return null;
    const s = n.replace(/^F[-\s]+/, '');
    const dash = (x) => x.replace(/\s*-\s*/g, ' - ');
    for (const c of [n, s, dash(n), dash(s)]) { const m = IMP.byName[c]; if (m && m.length === 1) return m[0]; }
    return null;
  }
  function impNum(v) {
    let s = String(v ?? '').trim().replace(/\s/g, '');
    if (s === '') return null;
    if (s.includes(',') && s.includes('.')) s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replaceAll('.', '').replace(',', '.') : s.replaceAll(',', '');
    else if (s.includes(',')) s = /^\d{1,3}(,\d{3})+$/.test(s) ? s.replaceAll(',', '') : s.replace(',', '.');
    const x = Number(s); return isNaN(x) ? NaN : x;
  }
  function impDate(v, fmt) {
    const s = String(v ?? '').trim(); if (!s) return '';
    let y, m, d, a;
    if ((a = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) { y = +a[1]; m = +a[2]; d = +a[3]; }
    else if ((a = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))) {
      y = +a[3]; if (y < 100) y += 2000;
      if (fmt === 'mdy') { m = +a[1]; d = +a[2]; } else { d = +a[1]; m = +a[2]; }
    } else return '';
    const dt = new Date(Date.UTC(y, m - 1, d));
    if (dt.getUTCFullYear() !== y || dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return '';
    return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  }
  function impSplit(line, d) {
    if (d === '\t') return line.split('\t');
    const out = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (q) { if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
      else if (c === '"') q = true;
      else if (c === d) { out.push(cur); cur = ''; }
      else cur += c;
    }
    out.push(cur); return out;
  }
  function impParse(text, fmt) {
    const lines = text.replace(/\r/g, '').split('\n').filter(l => l.trim() !== '');
    if (lines.length < 2) throw new Error('Tempel baris judul kolom + minimal 1 baris data.');
    const d = lines[0].includes('\t') ? '\t' : ((lines[0].match(/;/g) || []).length > (lines[0].match(/,/g) || []).length ? ';' : ',');
    const key = (h) => h.toLowerCase().replace(/[^a-z0-9]/g, '');
    const hdr = impSplit(lines[0], d).map(key);
    const find = (...names) => hdr.findIndex(h => names.includes(h));
    const col = { br: find('idpallet', 'nobr', 'br'), tgl: find('tanggalmasuk', 'tglmasuk'), size: find('size', 'item', 'itemname'),
                  ekor: find('ekorbkssisa', 'ekorsisa'), kg: find('kgsisa'), krg: find('gonisisa', 'karungsisa') };
    const miss = Object.entries({ 'IdPallet': col.br, 'TanggalMasuk': col.tgl, 'Size': col.size, 'Ekor/Bks-Sisa': col.ekor, 'Kg-Sisa': col.kg, 'Goni-Sisa': col.krg })
      .filter(([, v]) => v < 0).map(([k]) => k);
    if (miss.length) throw new Error('Kolom tidak ditemukan: ' + miss.join(', ') + '.\nPastikan baris judul kolom ikut ditempel.');
    return lines.slice(1).map(l => {
      const c = impSplit(l, d);
      const ex = { k: impNum(c[col.krg]), e: impNum(c[col.ekor]), kg: impNum(c[col.kg]) };
      const tglRaw = String(c[col.tgl] ?? '').trim(), size = String(c[col.size] ?? '').trim();
      const sh = (x) => (x === null || Number.isNaN(x)) ? '' : String(x);
      return { no_br: String(c[col.br] ?? '').trim().toUpperCase(), size, tglRaw, tgl: impDate(tglRaw, fmt), item_id: impFindItem(size),

        doc.setFontSize(14); doc.text('Rekap Stok Brengga per Item', 14, 15);
        doc.setFontSize(9); doc.setTextColor(100);
        doc.text(`Stok per ${fdate(tglPer)}${lampau ? ' (akhir hari)' : ' ' + new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })} · dicetak ${fdate(hariIni)}${s ? ' · filter: ' + V.q.trim() : ''}`, 14, 21);
        const numCols = {}; head.forEach((h, i) => { if (i >= 2) numCols[i] = { halign: 'right' }; });
        doc.autoTable({ head: [head], body, foot, startY: 25, theme: 'grid', showFoot: 'lastPage',
          styles: { fontSize: 8.5, cellPadding: 1.6 }, headStyles: { fillColor: [31, 41, 55] }, footStyles: { fillColor: [243, 244, 246], textColor: 20, fontStyle: 'bold' },
          columnStyles: numCols,
          didParseCell: (d) => { if (d.column.index >= 2) d.cell.styles.halign = 'right'; if (d.section !== 'body') return; const u = list[d.row.index].umur; if (u >= 26) d.cell.styles.fillColor = [253, 236, 234]; else if (u >= 13) d.cell.styles.fillColor = [255, 247, 237]; },
          didDrawPage: () => { doc.setFontSize(8); doc.setTextColor(120); doc.text('Halaman ' + doc.internal.getNumberOfPages(), 196, 290, { align: 'right' }); } });
        doc.save(`rekap-stok-brengga-${tglPer}.pdf`);
      } catch (e) { alert('Gagal membuat PDF: ' + errText(e)); }
      finally { bt.disabled = false; bt.textContent = lbl; }
    });
    $('rk-csv').addEventListener('click', () => {
      const q = (v) => '"' + String(v ?? '').replaceAll('"', '""') + '"';
      const head = ['Item', 'No. BR', 'Tgl masuk', 'Sisa karung', 'Sisa ekor', 'Sisa kg', 'Tersedia karung', 'Tersedia kg', 'Umur (mgg)'];
      const lines = [head.map(q).join(',')];
      Object.values(items).sort(cmp).forEach(x => x.br.forEach(b => lines.push([x.nama, b.no_br, String(b.tgl_masuk).slice(0, 10), b.sisa_karung, b.sisa_ekor ?? 0, Number(b.sisa_kg).toFixed(2), b.tersedia_karung, Number(b.tersedia_kg).toFixed(2), b.umur_minggu].map(q).join(','))));
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' }));
      a.download = `rekap-stok-brengga-${tglPer}.csv`; a.click();
    });
    render();
  };

  // =====================================================================
  // LAPORAN MUTASI PER ITEM (saldo awal, masuk dari CS, keluar jual / ke CS, saldo akhir)
  // =====================================================================
  const MUT = { dari: null, sampai: null };
  PAGES.mutasi = async () => {
    const addDay = (d, n) => { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + n); return x.toLocaleDateString('sv-SE'); };
    const cut = S.setting?.cutover_date || '2026-10-31';
    const minDari = addDay(cut, 1);
    const awalBulan = today().slice(0, 8) + '01';
    if (!MUT.dari) MUT.dari = awalBulan < minDari ? minDari : awalBulan;
    if (!MUT.sampai) MUT.sampai = today();
    $('main').innerHTML = `
      <h2>Laporan Mutasi per Item</h2>
      <p class="muted">Saldo awal = semua mutasi sebelum tanggal "dari" (termasuk saldo awal opname ${fdate(cut)}). Masuk = terima dari CS (WMS).
      Keluar = jual dan tarik ke CS. Dokumen pembalik mengurangi kolom keluar asalnya. Klik item untuk melihat rincian transaksinya.</p>
      <div class="row noprint">
        <div><label for="mt-dari">Dari</label><input type="date" id="mt-dari" value="${MUT.dari}" min="${minDari}"></div>
        <div><label for="mt-sampai">Sampai</label><input type="date" id="mt-sampai" value="${MUT.sampai}"></div>
        <div><label for="mt-q">Cari item</label><input id="mt-q" placeholder="mis. AU 0.3"></div>
        <div class="auto"><button class="btn-light" data-q="hari">Hari ini</button> <button class="btn-light" data-q="bulan">Bulan ini</button> <button class="btn-light" data-q="lalu">Bulan lalu</button></div>
        <div class="auto"><button id="mt-go">Tampilkan</button> <button class="btn-light" id="mt-csv">Unduh CSV</button> <button class="btn-light" id="mt-print">🖨 Cetak</button></div>
      </div>
      <div id="mt-msg" class="msg"></div>
      <div class="tbl-wrap" id="mt-list"><p class="muted">Memuat...</p></div>`;

    const G = ['sa', 'masuk', 'jual', 'kecs', 'lain', 'akhir'];
    const zero = () => ({ g: 0, e: 0, kg: 0 });
    let D = null;   // { items, lines, adaLain }
    const V = { q: '', open: new Set() };
    const z = (v, d = 0) => Math.abs(v) < (d ? 0.005 : 0.5) ? '<span class="muted">–</span>' : nf(v, d);

    const load = async () => {
      clearMsg($('mt-msg'));
      const dari = $('mt-dari').value, sampai = $('mt-sampai').value;
      if (!dari || !sampai || dari > sampai) { msg($('mt-msg'), 'Periode tidak valid.'); return; }
      MUT.dari = dari; MUT.sampai = sampai;
      $('mt-list').innerHTML = '<p class="muted">Memuat...</p>';
      // ambil semua mutasi s.d. tanggal "sampai" (per 1000 baris)
      const rows = [];
      for (let from = 0; ; from += 1000) {
        const part = await must(B.from('mutasi').select('id, tgl, no_br, jenis, karung, ekor, kg, ref_tabel, ref_id, keterangan, batch(item_id)')
          .lte('tgl', sampai).order('id').range(from, from + 999));
        rows.push(...part);
        if (part.length < 1000) break;
      }
      // nomor dokumen untuk rincian + jenis asal dokumen pembalik
      const inPer = rows.filter(r => r.tgl >= dari && r.jenis !== 'SALDO_AWAL');
      const psIds = [...new Set(inPer.filter(r => r.ref_tabel === 'picking_slip').map(r => r.ref_id))];
      const trIds = [...new Set(inPer.filter(r => r.ref_tabel === 'transfer').map(r => r.ref_id))];
      const ps = {}, tr = {};
      for (let i = 0; i < psIds.length; i += 200) (await must(B.from('picking_slip').select('id, no_ps, jenis, nama_customer').in('id', psIds.slice(i, i + 200)))).forEach(p => ps[p.id] = p);
      for (let i = 0; i < trIds.length; i += 200) (await must(B.from('transfer').select('id, no_transfer, wms_ps_no, wms_receipt_no').in('id', trIds.slice(i, i + 200)))).forEach(t => tr[t.id] = t);

      const items = {}, lines = [];
      let adaLain = false;
      rows.forEach(r => {
        const id = r.batch?.item_id || '?';
        const x = items[id] ||= { id, nama: String(itemName(id)).trim(), ...Object.fromEntries(G.map(k => [k, zero()])) };
        const v = { g: Number(r.karung || 0), e: Number(r.ekor || 0), kg: Number(r.kg || 0) };
        let k;
        if (r.jenis === 'SALDO_AWAL' || r.tgl < dari) k = 'sa';
        else if (r.jenis === 'MASUK') k = 'masuk';
        else if (r.jenis === 'JUAL') k = 'jual';
        else if (r.jenis === 'KE_WMS') k = 'kecs';
        else if (r.jenis === 'PEMBALIK') k = r.ref_tabel === 'transfer' ? 'kecs' : (ps[r.ref_id]?.jenis === 'JUAL' ? 'jual' : ps[r.ref_id]?.jenis === 'KE_WMS' ? 'kecs' : 'lain');
        else k = 'lain';
        const sign = (k === 'jual' || k === 'kecs') ? -1 : 1;   // keluar ditampilkan positif
        x[k].g += sign * v.g; x[k].e += sign * v.e; x[k].kg += sign * v.kg;
        x.akhir.g += v.g; x.akhir.e += v.e; x.akhir.kg += v.kg;
        if (k === 'lain') adaLain = true;
        if (k !== 'sa') {
          const p = ps[r.ref_id], t = tr[r.ref_id];
          const dok = r.ref_tabel === 'picking_slip' ? (p ? p.no_ps + (p.nama_customer ? ' · ' + p.nama_customer : '') : '')
                    : r.ref_tabel === 'transfer' ? (t ? [t.no_transfer, t.wms_ps_no || t.wms_receipt_no].filter(Boolean).join(' · ') : '') : '';
          lines.push({ ...r, item_id: id, kol: k, dok });
        }
      });
      Object.values(items).forEach(x => {   // buang item yang semuanya nol
        const any = G.some(k => Math.abs(x[k].g) > 0 || Math.abs(x[k].kg) > 0.005 || Math.abs(x[k].e) > 0.005);
        if (!any) delete items[x.id];
      });
      D = { items, lines, adaLain, dari, sampai };
      render();
    };

    const kolLabel = { masuk: 'Masuk dari CS', jual: 'Jual', kecs: 'Ke CS', lain: 'Penyesuaian' };
    const render = () => {
      if (!D) return;
      const s = V.q.trim().toLowerCase();
      const cols = ['sa', 'masuk', 'jual', 'kecs', ...(D.adaLain ? ['lain'] : []), 'akhir'];
      const list = Object.values(D.items).filter(x => !s || x.nama.toLowerCase().includes(s))
        .sort((a, b) => a.nama.localeCompare(b.nama, 'id', { numeric: true }));
      if (!list.length) { $('mt-list').innerHTML = '<p class="muted">Tidak ada data mutasi untuk periode ini.</p>'; return; }
      const T = Object.fromEntries(cols.map(k => [k, zero()]));
      list.forEach(x => cols.forEach(k => { T[k].g += x[k].g; T[k].e += x[k].e; T[k].kg += x[k].kg; }));
      const cells = (o, k) => `<td class="n"${k === 'sa' || k === 'akhir' ? ' style="font-weight:600"' : ''}>${z(o.g)}</td><td class="n">${z(o.e)}</td><td class="n"${k === 'sa' || k === 'akhir' ? ' style="font-weight:600"' : ''}>${z(o.kg, 2)}</td>`;
      const nKol = 1 + cols.length * 3;
      const body = list.map(x => {
        const open = V.open.has(x.id);
        const neg = x.akhir.g < 0 || x.akhir.kg < -0.005;
        let h = `<tr class="click${neg ? ' age-26' : ''}" data-id="${esc(x.id)}"><td>${open ? '▾' : '▸'} ${esc(x.nama)}</td>${cols.map(k => cells(x[k], k)).join('')}</tr>`;
        if (open) {
          const ls = D.lines.filter(l => l.item_id === x.id).sort((a, b) => a.tgl.localeCompare(b.tgl) || a.id - b.id);
          h += `<tr><td colspan="${nKol}" style="padding:4px 8px 10px 26px;background:#f9fafc">${ls.length ? `<table class="tbl" style="margin:0"><thead><tr><th>Tgl</th><th>No. BR</th><th>Kolom</th><th>Dokumen</th><th class="n">Goni</th><th class="n">Ekor</th><th class="n">Kg</th><th>Keterangan</th></tr></thead><tbody>
            ${ls.map(l => `<tr><td>${fdate(l.tgl)}</td><td>${esc(l.no_br)}</td><td>${l.jenis === 'PEMBALIK' ? pill('PEMBALIK') + ' ' : ''}${esc(kolLabel[l.kol])}</td><td>${esc(l.dok)}</td><td class="n">${nf(l.karung)}</td><td class="n">${nf(l.ekor)}</td><td class="n">${kg(l.kg)}</td><td>${esc(l.keterangan || '')}</td></tr>`).join('')}
            </tbody></table>` : '<span class="muted">Tidak ada transaksi dalam periode ini.</span>'}</td></tr>`;
        }
        return h;
      }).join('');
      const grpHead = { sa: 'Saldo Awal', masuk: 'Masuk dari CS', jual: 'Keluar: Jual', kecs: 'Keluar: ke CS', lain: 'Penyesuaian', akhir: 'Saldo Akhir' };
      $('mt-list').innerHTML = `<p class="muted" style="margin:4px 0">Periode ${fdate(D.dari)} s.d. ${fdate(D.sampai)} · ${list.length} item${list.some(x => x.akhir.g < 0 || x.akhir.kg < -0.005) ? ' · <b>merah = saldo akhir minus</b>' : ''}</p>
        <table class="tbl"><thead>
        <tr><th rowspan="2">Item</th>${cols.map(k => `<th colspan="3" style="text-align:center;border-left:1px solid #e5e7eb">${grpHead[k]}</th>`).join('')}</tr>
        <tr>${cols.map(() => '<th class="n" style="border-left:1px solid #e5e7eb">Goni</th><th class="n">Ekor</th><th class="n">Kg</th>').join('')}</tr></thead>
        <tbody>${body}</tbody>
        <tfoot><tr><td>Total</td>${cols.map(k => cells(T[k], k)).join('')}</tr></tfoot></table>`;
      document.querySelectorAll('#mt-list tr[data-id]').forEach(trEl => trEl.addEventListener('click', () => {
        const id = trEl.dataset.id; V.open.has(id) ? V.open.delete(id) : V.open.add(id); render();
      }));
    };

    const setPer = (a, b) => { $('mt-dari').value = a < minDari ? minDari : a; $('mt-sampai').value = b; load().catch(e => msg($('mt-msg'), errText(e))); };
    document.querySelectorAll('#main button[data-q]').forEach(bt => bt.addEventListener('click', () => {
      const t = today();
      if (bt.dataset.q === 'hari') setPer(t, t);
      else if (bt.dataset.q === 'bulan') setPer(t.slice(0, 8) + '01', t);
      else { const awal = new Date(t.slice(0, 8) + '01T00:00:00'); awal.setMonth(awal.getMonth() - 1); const a = awal.toLocaleDateString('sv-SE'); setPer(a, addDay(t.slice(0, 8) + '01', -1)); }
    }));
    $('mt-go').addEventListener('click', () => load().catch(e => msg($('mt-msg'), errText(e))));
    $('mt-q').addEventListener('input', (e) => { V.q = e.target.value; render(); });
    $('mt-print').addEventListener('click', () => window.print());
    $('mt-csv').addEventListener('click', () => {
      if (!D) return;
      const q = (v) => '"' + String(v ?? '').replaceAll('"', '""') + '"';
      const cols = ['sa', 'masuk', 'jual', 'kecs', ...(D.adaLain ? ['lain'] : []), 'akhir'];
      const nm = { sa: 'Saldo awal', masuk: 'Masuk dari CS', jual: 'Keluar jual', kecs: 'Keluar ke CS', lain: 'Penyesuaian', akhir: 'Saldo akhir' };
      const head = ['Item', ...cols.flatMap(k => [nm[k] + ' goni', nm[k] + ' ekor', nm[k] + ' kg'])];
      const out = [head.map(q).join(',')];
      Object.values(D.items).sort((a, b) => a.nama.localeCompare(b.nama, 'id', { numeric: true }))
        .forEach(x => out.push([x.nama, ...cols.flatMap(k => [x[k].g, Math.round(x[k].e * 100) / 100, x[k].kg.toFixed(2)])].map(q).join(',')));
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(['﻿' + out.join('\n')], { type: 'text/csv;charset=utf-8' }));
      a.download = `mutasi-brengga-${D.dari}_${D.sampai}.csv`; a.click();
    });
    await load();
  };
</script>
</body>
</html>
